name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: |
          Rscript -e 'install.packages(c("data.table","jsonlite","survival","glmnet","testthat","withr","BiocManager"))'
          Rscript -e 'BiocManager::install(c("limma","edgeR"), update = FALSE, ask = FALSE)'
      - run: Rscript tests/testthat.R
